{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow-lg">

            <div class="card-body p-5">

                <h2 class="text-center mb-4">

                    Upload Resume

                </h2>

                <form method="POST"
                      enctype="multipart/form-data">

                    {% csrf_token %}

                    <div class="mb-4">

                        <label class="form-label">

                            Select Resume

                        </label>

                        {{ form.resume }}

                    </div>

                    <button
                        type="submit"
                        class="btn btn-dark w-100">

                        Upload Resume

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
